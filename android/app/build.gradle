plugins {
    id "com.android.application"
}

android {
    namespace "ng.edu.futo.soe.chainvote"
    compileSdk 34

    defaultConfig {
        applicationId "ng.edu.futo.soe.chainvote"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.3.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.webkit:webkit:1.10.0"
}
